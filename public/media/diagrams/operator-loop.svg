<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Operator loop</title>
  <desc id="desc">Four connected stages: observe field evidence, frame product intent, build a working system, and operate it to produce new evidence.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#C7FF4A"/></marker></defs>
<rect width="1600" height="700" rx="32" fill="#0B0D0C"/>
<text x="80" y="105" fill="#C7FF4A" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" letter-spacing="4">THE OPERATOR LOOP</text>
<text x="80" y="166" fill="#F1F4ED" font-family="Inter,system-ui,sans-serif" font-size="42" font-weight="780">Evidence moves in both directions.</text>
<path d="M420 350H505" stroke="#C7FF4A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M780 350H865" stroke="#C7FF4A" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1140 350H1225" stroke="#C7FF4A" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(160 245)"><rect width="260" height="210" rx="24" fill="#121613" stroke="#303A32"/><text x="28" y="48" fill="#F3B56A" font-family="ui-monospace,monospace" font-size="20">01</text><text x="28" y="112" fill="#F1F4ED" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="750">Observe</text><text x="28" y="158" fill="#AEB8AE" font-family="Inter,system-ui,sans-serif" font-size="21">field evidence</text></g><g transform="translate(520 245)"><rect width="260" height="210" rx="24" fill="#121613" stroke="#303A32"/><text x="28" y="48" fill="#C7FF4A" font-family="ui-monospace,monospace" font-size="20">02</text><text x="28" y="112" fill="#F1F4ED" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="750">Frame</text><text x="28" y="158" fill="#AEB8AE" font-family="Inter,system-ui,sans-serif" font-size="21">product intent</text></g><g transform="translate(880 245)"><rect width="260" height="210" rx="24" fill="#121613" stroke="#303A32"/><text x="28" y="48" fill="#79C8FF" font-family="ui-monospace,monospace" font-size="20">03</text><text x="28" y="112" fill="#F1F4ED" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="750">Build</text><text x="28" y="158" fill="#AEB8AE" font-family="Inter,system-ui,sans-serif" font-size="21">working system</text></g><g transform="translate(1240 245)"><rect width="260" height="210" rx="24" fill="#121613" stroke="#303A32"/><text x="28" y="48" fill="#F3B56A" font-family="ui-monospace,monospace" font-size="20">04</text><text x="28" y="112" fill="#F1F4ED" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="750">Operate</text><text x="28" y="158" fill="#AEB8AE" font-family="Inter,system-ui,sans-serif" font-size="21">measured use</text></g>
<path d="M1370 480C1370 610 260 610 260 480" fill="none" stroke="#AEB8AE" stroke-width="2" stroke-dasharray="9 10" marker-end="url(#arrow)"/>
<text x="800" y="628" fill="#AEB8AE" font-family="Inter,system-ui,sans-serif" font-size="19" text-anchor="middle">operation produces the next observation</text>
</svg>
